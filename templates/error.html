{% extends 'base.html' if current_user else 'bare.html' %}

  <div style="font-size:48px;font-weight:900;color:var(--navy-700)">{{ code }}</div>

  <a class="btn btn-primary" href="{{ url_for('main.dashboard') }}">{{ icon('home','sm') }} Bosh sahifa</a>
</div></section>
{% endblock %}
