services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data            # database, photos and backups live here
    expose:
      - "5000"

  # Nightly consistent backup (SQLite online-backup API + photos), keeps BACKUP_KEEP_DAYS days.
  backup:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      BACKUP_INTERVAL_HOURS: "24"
    volumes:
      - ./data:/data
    command: ["python", "-m", "surxon.backup"]

  # Sends waybill PDFs and trip photos to the private Telegram archive channel and rows to Google Sheets,
  # and regenerates any missing PDF. Channels without settings stay "not connected" (jobs wait in the queue).
  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    command: ["python", "-m", "surxon.outbox"]

  caddy:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESSES: ${SITE_ADDRESSES:-surxan-paxta.uz, www.surxan-paxta.uz}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  caddy_data:
  caddy_config:
